name: Publish

on:
  workflow_dispatch: {}

jobs:
  dotnet-noarch:
    name: dotnet-noarch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 'Cache: .nuke/temp, ~/.nuget/packages'
        uses: actions/cache@v5
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
      - name: 'Run: release'
        run: ./build.sh release

  windows-x64:
    name: windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 'Cache: .nuke/temp, ~/.nuget/packages'
        uses: actions/cache@v5
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
      - name: 'Run: release-windows-x64'
        run: ./build.cmd release-windows-x64
      - name: 'Publish: windows-x64 zip'
        uses: actions/upload-artifact@v5
        with:
          name: release-windows-x64
          path: .output/*.zip
          include-hidden-files: true

  linux-x64:
    name: linux-x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 'Cache: .nuke/temp, ~/.nuget/packages'
        uses: actions/cache@v5
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
      - name: 'Install: Native AOT build prerequisites'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: 'Run: release-linux-x64'
        run: ./build.sh release-linux-x64
      - name: 'Publish: linux-x64 zip'
        uses: actions/upload-artifact@v5
        with:
          name: release-linux-x64
          path: .output/*.zip
          include-hidden-files: true

  linux-arm64:
    name: linux-arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 'Cache: .nuke/temp, ~/.nuget/packages'
        uses: actions/cache@v5
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
      - name: 'Install: Native AOT build prerequisites'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: 'Run: release-linux-arm64'
        run: ./build.sh release-linux-arm64
      - name: 'Publish: linux-arm64 zip'
        uses: actions/upload-artifact@v5
        with:
          name: release-linux-arm64
          path: .output/*.zip
          include-hidden-files: true

  macos-arm64:
    name: macos-arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 'Cache: .nuke/temp, ~/.nuget/packages'
        uses: actions/cache@v5
        with:
          path: |
            .nuke/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
      - name: 'Run: release-macos-arm64'
        run: ./build.sh release-macos-arm64
      - name: 'Publish: macos-arm64 zip'
        uses: actions/upload-artifact@v5
        with:
          name: release-macos-arm64
          path: .output/*.zip
          include-hidden-files: true

  publish:
    name: publish
    needs: [windows-x64, linux-x64, linux-arm64, macos-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 'Download: platform zips'
        uses: actions/download-artifact@v5
        with:
          pattern: release-*
          path: .output
          merge-multiple: true
      - name: 'Run: publish-to-github'
        run: ./build.sh publish-to-github
        env:
          GITHUB_API_KEY: ${{ secrets.GITHUB_TOKEN }}
